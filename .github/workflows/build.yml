name: Build IPA

on:
  workflow_dispatch:   # bouton "Run workflow" manuel sur GitHub
  push:
    paths:
      - "ios/**"

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Sélectionner la dernière version de Xcode
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (non signé)
        run: |
          xcodebuild \
            -project YTMusic.xcodeproj \
            -scheme YTMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Empaqueter en .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/YTMusic.app Payload/
          zip -r YTMusic.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: YTMusic-ipa
          path: ios/YTMusic.ipa